name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and schema contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-app

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate SDUI schemas
        run: npm run test:schemas

      - name: Contract coverage
        run: npm run test:contract

  web-build-check:
    name: Expo Web Export & Bundle Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [validate]
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-app

      - name: Export Expo web bundle
        run: |
          set -euo pipefail
          npm run export:web
          test -f dist/index.html
          touch dist/.nojekyll

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: expo-web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true
