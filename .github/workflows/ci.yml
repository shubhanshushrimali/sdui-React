name: CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, test, and schema contract
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-app

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Validate SDUI schemas
        run: npm run test:schemas

      - name: Contract coverage
        run: npm run test:contract

  web-build-check:
    name: Expo Web Export & Bundle Integrity
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [validate]
    permissions:
      contents: read
      actions: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node and install
        uses: ./.github/actions/setup-node-app

      - name: Use a root-relative base for pull request artifacts
        if: github.event_name == 'pull_request'
        run: node --input-type=module -e "import {readFileSync,writeFileSync} from 'node:fs'; const app=JSON.parse(readFileSync('app.json','utf8')); app.expo.experiments.baseUrl='/'; writeFileSync('app.json', JSON.stringify(app, null, 2) + '\n');"

      - name: Export Expo web bundle
        run: |
          set -euo pipefail
          npm run export:web
          test -f dist/index.html
          touch dist/.nojekyll

      - name: Upload web artifact
        uses: actions/upload-artifact@v7
        with:
          name: expo-web-dist
          path: dist
          retention-days: 7
          if-no-files-found: error
          include-hidden-files: true

  preview:
    name: Comment with the web artifact
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    needs: [web-build-check]
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Upsert the preview comment
        uses: actions/github-script@v8
        with:
          script: |
            const marker = '<!-- sdui-web-preview -->';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              marker,
              '### Web preview',
              '',
              `The Expo web export for this pull request is the \`expo-web-dist\` artifact on the [web export run](${runUrl}).`,
              '',
              'Production Pages stays at https://shubhanshushrimali.github.io/sdui-React/.',
            ].join('\n');
            try {
              const { data: comments } = await github.rest.issues.listComments({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
              });
              const existing = comments.find((comment) => comment.body && comment.body.includes(marker));
              if (existing) {
                await github.rest.issues.updateComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  comment_id: existing.id,
                  body,
                });
              } else {
                await github.rest.issues.createComment({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  body,
                });
              }
            } catch (error) {
              if (error.status === 403) {
                core.warning('Could not comment on this pull request.');
                return;
              }
              throw error;
            }
